---
plugins:
  - rubocop-performance
  - rubocop-rake
  - rubocop-rspec

AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 2.6
  Exclude:
    - bin/*
    - gemfiles/*
    - pkg/**/*
    - vendor/**/*
    - integration/bin/*

Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always

RSpec/MessageSpies:
  EnforcedStyle: receive

RSpec/InstanceVariable:
  Exclude:
    - spec/sitemap_generator/sitemap_generator_spec.rb
    - integration/spec/sitemap_generator/tasks_spec.rb
  # Permanent, not follow-up debt: remaining instances are ivars set in a before(:all) block
  # (tied to the RSpec/BeforeAfterAll exclusion below -- confirmed these before(:all) blocks
  # are a deliberate perf optimization, not a bug, so the ivars can't convert to `let` without
  # undoing that), plus one legitimate stash/restore-external-state pattern in tasks_spec.rb
  # that doesn't map cleanly onto `let`'s lazy memoization.

RSpec/SpecFilePathFormat:
  Exclude:
    - spec/sitemap_generator/adapters/aws_sdk_adapter_spec.rb
    - spec/sitemap_generator/adapters/fog_adapter_spec.rb
    - spec/sitemap_generator/adapters/google_storage_adapter_spec.rb
    - spec/sitemap_generator/adapters/s3_adapter_spec.rb
    - spec/sitemap_generator/core_ext/bigdecimal_spec.rb
    - spec/sitemap_generator/core_ext/numeric_spec.rb
    - spec/sitemap_generator/utilities/existence_spec.rb
    - spec/sitemap_generator/utilities/hash_spec.rb
    - spec/sitemap_generator/utilities/rounding_spec.rb
  # Permanent, not follow-up debt: these live in adapters/core_ext/utilities subdirectories
  # by deliberate grouping, which the cop's namespace-to-path mapping doesn't account for.

RSpec/VerifiedDoubles:
  Exclude:
    - spec/sitemap_generator/adapters/s3_adapter_spec.rb
    - spec/sitemap_generator/interpreter_spec.rb
  # Permanent, not follow-up debt: s3_adapter_spec.rb's doubles stand in for Fog's
  # provider-specific classes, which are defined via metaprogramming and inconsistently
  # resolvable as constants (e.g. Fog::AWS::Storage::Directory isn't even defined until
  # certain methods are called) -- too fragile to verify against reliably. interpreter_spec.rb's
  # remaining double stands in for ActionController::Base, which isn't loaded in this
  # (deliberately non-Rails) unit test environment, so there's no real class to verify against.

RSpec/BeforeAfterAll:
  Exclude:
    - spec/sitemap_generator/sitemap_generator_spec.rb
    - integration/spec/sitemap_generator/tasks_spec.rb
    - integration/spec/spec_helper.rb
  # Permanent, not follow-up debt: each before(:all) in sitemap_generator_spec.rb/tasks_spec.rb
  # generates real sitemap files once, shared read-only across 5-6 examples in the same group
  # (file existence, link counts, XML schema validation, whitespace checks) -- a deliberate perf
  # optimization, not an oversight. spec_helper.rb's config.after(:all) is a one-time, whole-suite
  # teardown (resets the app's public/ dir after the entire integration run), not per-example
  # state -- correct as :all, would be actively wrong run per example. Verified by contrast:
  # interpreter_spec.rb's before(:all)/after(:all) was NOT either of these patterns (nothing read
  # its output, it only reset global state) and has been converted to before/after :each, which is
  # strictly safer isolation with no performance cost.

RSpec/NoExpectationExample:
  AllowedPatterns:
    - "^expect_"

Style/Documentation:
  Exclude:
    - spec/**/*
    - integration/spec/**/*
  # Permanent, not follow-up debt: doc comments on test scaffolding/dummy-app fixtures
  # add no value. Scoped here (not Enabled: false) so lib/ keeps full enforcement.
